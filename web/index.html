<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OpenPattern</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
<header>
  <div class="brand"><strong>OpenPattern</strong><span>studio alpha</span></div>
  <div class="top-actions">
    <button id="undo" disabled>Deshacer</button>
    <button id="redo" disabled>Rehacer</button>
    <button id="resetView">100%</button>
    <button id="download" class="primary">Exportar patrón</button>
  </div>
</header>

<main>
  <aside class="left-panel">
    <section class="section">
      <div class="section-title">Herramientas</div>
      <div class="tools">
        <button class="tool active" data-tool="pencil">Pincel</button>
        <button class="tool" data-tool="eraser">Borrar</button>
        <button class="tool" data-tool="fill">Rellenar</button>
        <button class="tool" data-tool="pan">Mover</button>
      </div>
      <label>Tamaño del pincel<div class="range-row"><input id="brushSize" type="range" min="1" max="12" value="1"><output id="brushSizeValue">1×1</output></div></label>
      <label>Tamaño del borrador<div class="range-row"><input id="eraserSize" type="range" min="1" max="12" value="1"><output id="eraserSizeValue">1×1</output></div></label>
    </section>

    <section class="section conversion">
      <div class="section-title">Conversion Studio</div>
      <label>Técnica<select id="technique"></select></label>
      <label>Imagen o pixel art<input id="image" type="file" accept="image/*"></label>
      <canvas id="sourcePreview" width="256" height="138"></canvas>
      <div class="field-row">
        <label>Ancho<input id="width" type="number" min="8" max="300" value="48"></label>
        <label>Colores<input id="colors" type="number" min="2" max="32" value="8"></label>
      </div>
      <label class="check"><input id="pixelMode" type="checkbox"><span>Pixel art: bordes duros</span></label>
      <label class="check"><input id="cleanGrid" type="checkbox"><span>Ignorar rejilla/fondo gris claro</span></label>
      <label>Umbral<div class="range-row"><input id="lightThreshold" type="range" min="170" max="250" value="215"><output id="lightThresholdValue">215</output></div></label>
      <label>Brillo<div class="range-row"><input id="brightness" type="range" min="-100" max="100" value="0"><output id="brightnessValue">0</output></div></label>
      <label>Contraste<div class="range-row"><input id="contrast" type="range" min="-100" max="100" value="0"><output id="contrastValue">0</output></div></label>
      <label>Saturación<div class="range-row"><input id="saturation" type="range" min="-100" max="100" value="0"><output id="saturationValue">0</output></div></label>
      <div class="conversion-actions"><button id="regenerate" class="primary">Regenerar</button><button id="resetConversion">Restablecer</button></div>
      <label class="check"><input id="autoRegenerate" type="checkbox" checked><span>Regenerar automáticamente</span></label>
      <div id="sourceStatus" class="microcopy">Carga una imagen para empezar.</div>
    </section>

    <section class="section compact-actions">
      <button id="mirror">Espejar</button>
      <button id="clearAll" class="danger">Limpiar</button>
    </section>
  </aside>

  <section class="workspace">
    <div class="canvas-shell"><canvas id="canvas" width="1200" height="800"></canvas></div>
    <div class="statusbar"><div id="status">Listo.</div><div id="saveStatus">Guardado local</div></div>
  </section>

  <aside class="right-panel">
    <section class="section">
      <div class="section-title">Pattern Viewer</div>
      <canvas id="patternViewer" width="260" height="150"></canvas>
      <div id="projectMeta" class="microcopy"></div>
    </section>

    <section class="section">
      <div class="section-title">Técnica</div>
      <div id="techniqueOptions" class="technique-options"></div>
    </section>

    <section class="section">
      <div class="section-title">Vista y guías</div>
      <label class="check"><input id="showGuides" type="checkbox" checked><span>Guías mayores</span></label>
      <label>Separación de guías<input id="guideSpacing" type="number" min="2" max="50" value="10"></label>
      <label class="check"><input id="showCoordinates" type="checkbox" checked><span>Coordenadas</span></label>
      <label class="check"><input id="trackMode" type="checkbox"><span>Modo seguimiento</span></label>
      <div class="tracker"><button id="trackPrev">◀</button><span id="trackLabel">Fila 1</span><button id="trackNext">▶</button></div>
    </section>

    <section class="section">
      <div class="section-title">Paleta</div>
      <div id="palette" class="palette"></div>
      <div class="color-editor"><input id="paletteColor" type="color" value="#000000"><button id="addColor">Añadir</button><button id="updateColor">Aplicar</button></div>
    </section>

    <section class="section">
      <div class="section-title">Leyenda técnica</div>
      <div id="techniqueLegend" class="technique-legend"></div>
    </section>

    <section class="section">
      <div class="section-title">Historial</div>
      <div id="historyMeta" class="history-meta">Sin cambios</div>
      <div id="history" class="history"></div>
    </section>
  </aside>
</main>
<script type="module" src="./app.mjs"></script>
</body>
</html>
