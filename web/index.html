<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OpenPattern</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header>
    <div class="brand">
      <strong>OpenPattern</strong>
      <span>editor alpha</span>
    </div>

    <div class="top-actions">
      <button id="undo" title="Deshacer (Ctrl+Z)" disabled>Deshacer</button>
      <button id="redo" title="Rehacer (Ctrl+Y)" disabled>Rehacer</button>
      <button id="resetView" title="Restablecer zoom y posición">100%</button>
      <button id="download" class="primary">Exportar patrón</button>
    </div>
  </header>

  <main>
    <aside>
      <div class="section">
        <div class="section-title">Herramientas</div>
        <div class="tools" role="toolbar" aria-label="Herramientas de edición">
          <button class="tool active" data-tool="pencil" title="Pincel (B)">Pincel</button>
          <button class="tool" data-tool="eraser" title="Borrador (E)">Borrar</button>
          <button class="tool" data-tool="fill" title="Relleno (G)">Rellenar</button>
          <button class="tool" data-tool="pan" title="Mover lienzo (H)">Mover</button>
        </div>

        <label>Tamaño del pincel
          <div class="range-row">
            <input id="brushSize" type="range" min="1" max="12" value="1" />
            <output id="brushSizeValue">1×1</output>
          </div>
        </label>

        <label>Tamaño del borrador
          <div class="range-row">
            <input id="eraserSize" type="range" min="1" max="12" value="1" />
            <output id="eraserSizeValue">1×1</output>
          </div>
        </label>
      </div>

      <div class="section">
        <label>Técnica
          <select id="technique"></select>
        </label>

        <label>Imagen o pixel art
          <input id="image" type="file" accept="image/*" />
        </label>

        <label class="check">
          <input id="pixelMode" type="checkbox" />
          <span>Pixel art: conservar bordes duros</span>
        </label>

        <div class="field-row">
          <label>Ancho
            <input id="width" type="number" min="8" max="300" value="48" />
          </label>
          <label>Colores
            <input id="colors" type="number" min="2" max="32" value="8" />
          </label>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Paleta</div>
        <div id="palette" class="palette"></div>

        <div class="color-editor">
          <input id="paletteColor" type="color" value="#000000" aria-label="Color de paleta" />
          <button id="addColor">Añadir</button>
          <button id="updateColor">Actualizar</button>
        </div>
      </div>

      <div class="section compact-actions">
        <button id="mirror">Espejar horizontal</button>
        <button id="clearAll" class="danger">Limpiar lienzo</button>
      </div>

      <div class="section">
        <div class="section-title">Historial</div>
        <div id="historyMeta" class="history-meta">Sin cambios</div>
        <div id="history" class="history"></div>
      </div>

      <p class="hint">
        Pinta arrastrando. Rueda del mouse = zoom. Botón central, barra espaciadora o herramienta Mover = desplazar.
        El patrón se guarda automáticamente en este navegador.
      </p>
    </aside>

    <section class="workspace">
      <div class="canvas-shell">
        <canvas id="canvas" width="1200" height="800"></canvas>
      </div>
      <div class="statusbar">
        <div id="status">Listo.</div>
        <div id="saveStatus">Guardado local</div>
      </div>
    </section>
  </main>

  <script type="module" src="./app.mjs"></script>
</body>
</html>
